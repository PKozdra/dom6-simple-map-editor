[package]
name = "dom6-simple-map-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Map editor for Dominions 6 .d6m recipes: heights, terrain, connections, rivers"
default-run = "dom6-simple-map-editor"

[[bin]]
name = "dom6-simple-map-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.32", default-features = false }
png = "0.17"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
strip = false
debug = 1
