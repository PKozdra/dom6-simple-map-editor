[package]
name = "dom6-simple-map-editor"
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Map editor for Dominions 6 .d6m recipes: heights, terrain, connections, rivers"
default-run = "dom6-simple-map-editor"

[workspace]
members = ["crates/mapgen"]

[[bin]]
name = "dom6-simple-map-editor"
path = "src/main.rs"

[[bin]]
name = "mapgen-worker"
path = "src/bin/mapgen_worker.rs"

[dependencies]
dom6-mapgen = { path = "crates/mapgen" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.32", default-features = false }
png = "0.17"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Worker", "MessageEvent", "DedicatedWorkerGlobalScope", "console"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[build-dependencies]
winresource = "0.1.31"
