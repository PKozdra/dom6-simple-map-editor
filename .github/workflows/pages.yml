name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - name: Drop the runner's preinstalled toolchain so the cache key only sees ours
        shell: bash
        run: rustup toolchain list | grep -v '^1\.88' | awk '{print $1}' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Use every runner core
        shell: bash
        run: echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Install trunk
        shell: bash
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C /usr/local/bin
          trunk --version
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build
        shell: bash
        run: |
          export D6SME_VERSION="$(git describe --tags --match 'v*' --always)"
          echo "web build version $D6SME_VERSION"
          trunk build --release --locked --public-url "./"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
